<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codex Relay</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #111;
}

.app {
  max-width: 1000px;
  margin: auto;
  min-height: 100vh;
  background: white;
}

header {
  padding: 20px;
  border-bottom: 1px solid #ddd;
  font-size: 22px;
  font-weight: bold;
}

nav {
  display: flex;
  border-bottom: 1px solid #ddd;
}

nav button {
  flex: 1;
  padding: 15px;
  border: 0;
  border-radius: 0;
  background: white;
  color: #111;
  font-size: 15px;
}

nav button.active {
  background: #111;
  color: white;
}

section {
  padding: 20px;
}

.hidden {
  display: none;
}

.card {
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 15px;
}

input,
textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  margin: 7px 0 12px;
  font-size: 15px;
  font-family: Arial, sans-serif;
}

button {
  padding: 11px 16px;
  border: 0;
  border-radius: 8px;
  background: #111;
  color: white;
  cursor: pointer;
  font-size: 14px;
}

button:disabled {
  opacity: 0.6;
  cursor: default;
}

.chatbox {
  min-height: 400px;
  max-height: 600px;
  overflow-y: auto;
  margin-bottom: 15px;
}

.message {
  padding: 12px 15px;
  margin: 10px 0;
  border-radius: 10px;
  white-space: pre-wrap;
  word-break: break-word;
}

.user {
  background: #eee;
  margin-left: 15%;
}

.assistant {
  background: #f7f7f7;
  margin-right: 15%;
}

.row {
  display: flex;
  gap: 10px;
  align-items: flex-end;
}

.row textarea {
  flex: 1;
  margin-bottom: 0;
  min-height: 50px;
  resize: vertical;
}

.row button {
  width: 100px;
  height: 50px;
}

.result {
  margin-top: 12px;
  padding: 10px;
  background: #f5f5f5;
  border-radius: 8px;
  white-space: pre-wrap;
  word-break: break-word;
}

.key {
  font-family: monospace;
  background: #eee;
  padding: 10px;
  border-radius: 8px;
  word-break: break-all;
  user-select: all;
}

.status {
  font-size: 13px;
  margin-top: 8px;
  color: #666;
}

h2 {
  margin-top: 0;
}
</style>
</head>

<body>

<div class="app">

<header>
Codex Relay
</header>

<nav>

<button
id="chatTab"
class="active"
onclick="showPage('chat')">
Chat
</button>

<button
id="adminTab"
onclick="showPage('admin')">
Admin
</button>

</nav>

<section id="chat">

<div class="card">

<label>Customer API Key</label>

<input
id="apiKey"
placeholder="cr_..."
autocomplete="off">

<div
id="balanceStatus"
class="status">
</div>

<button onclick="checkBalance()">
Check Balance
</button>

</div>

<div
id="chatbox"
class="chatbox">

<div class="message assistant">
Hello! Ask me anything.
</div>

</div>

<div class="row">

<textarea
id="message"
placeholder="Type your message..."></textarea>

<button
id="sendButton"
onclick="sendMessage()">
Send
</button>

</div>

</section>


<section
id="admin"
class="hidden">

<div class="card">

<h2>Admin Login</h2>

<input
id="adminSecret"
type="password"
placeholder="Admin password"
autocomplete="off">

</div>


<div class="card">

<h2>Create Customer Key</h2>

<button onclick="createKey()">
Create Key
</button>

<div
id="newKey"
class="result">
</div>

</div>


<div class="card">

<h2>Add Balance</h2>

<input
id="customerKey"
placeholder="cr_...">

<input
id="amount"
type="number"
step="0.01"
min="0"
placeholder="RM amount">

<input
id="note"
placeholder="Note">

<button onclick="addBalance()">
Add Balance
</button>

<div
id="balanceResult"
class="result">
</div>

</div>


<div class="card">

<h2>Disable Customer Key</h2>

<input
id="disableKey"
placeholder="cr_...">

<button onclick="disableKey()">
Disable Key
</button>

<div
id="disableResult"
class="result">
</div>

</div>

</section>

</div>


<script>

const API = "https://codex-relay.onrender.com";


function showPage(page) {

  document
    .getElementById("chat")
    .classList
    .toggle("hidden", page !== "chat");

  document
    .getElementById("admin")
    .classList
    .toggle("hidden", page !== "admin");

  document
    .getElementById("chatTab")
    .classList
    .toggle("active", page === "chat");

  document
    .getElementById("adminTab")
    .classList
    .toggle("active", page === "admin");
}


/* Check customer balance */

async function checkBalance() {

  const key =
    document
      .getElementById("apiKey")
      .value
      .trim();

  const result =
    document
      .getElementById("balanceStatus");

  if (!key) {
    result.textContent = "Enter your customer API key.";
    return;
  }

  result.textContent = "Checking...";

  try {

    const response =
      await fetch(
        API + "/v1/balance",
        {
          method: "GET",
          headers: {
            "Authorization": "Bearer " + key
          }
        }
      );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data?.error?.message ||
        "Failed to load balance"
      );
    }

    result.textContent =
      "Balance: RM " +
      Number(data.balance).toFixed(2);

  } catch (error) {

    result.textContent =
      "Error: " + error.message;
  }
}


/* Create customer key */

async function createKey() {

  const secret =
    document
      .getElementById("adminSecret")
      .value
      .trim();

  const result =
    document
      .getElementById("newKey");

  if (!secret) {
    result.textContent =
      "Enter admin password.";
    return;
  }

  result.textContent =
    "Creating...";

  try {

    const response =
      await fetch(
        API + "/admin/create-key",
        {
          method: "POST",
          headers: {
            "X-Admin-Secret": secret
          }
        }
      );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data?.error?.message ||
        "Failed to create key"
      );
    }

    result.innerHTML =
      "<b>Customer API Key:</b><br><br>" +
      "<div class='key'>" +
      data.api_key +
      "</div>";

  } catch (error) {

    result.textContent =
      "Error: " + error.message;
  }
}


/* Add balance */

async function addBalance() {

  const secret =
    document
      .getElementById("adminSecret")
      .value
      .trim();

  const key =
    document
      .getElementById("customerKey")
      .value
      .trim();

  const amount =
    Number(
      document
        .getElementById("amount")
        .value
    );

  const note =
    document
      .getElementById("note")
      .value
      .trim();

  const result =
    document
      .getElementById("balanceResult");

  if (!secret) {
    result.textContent =
      "Enter admin password.";
    return;
  }

  if (!key) {
    result.textContent =
      "Enter customer API key.";
    return;
  }

  if (!Number.isFinite(amount) || amount <= 0) {
    result.textContent =
      "Enter a valid amount.";
    return;
  }

  result.textContent =
    "Adding balance...";

  try {

    const response =
      await fetch(
        API + "/admin/add-balance",
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json",
            "X-Admin-Secret":
              secret
          },
          body: JSON.stringify({
            api_key: key,
            amount: amount,
            note: note
          })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data?.error?.message ||
        "Failed to add balance"
      );
    }

    result.textContent =
      "Success. Balance: RM " +
      Number(data.balance).toFixed(2);

  } catch (error) {

    result.textContent =
      "Error: " + error.message;
  }
}


/* Disable customer key */

async function disableKey() {

  const secret =
    document
      .getElementById("adminSecret")
      .value
      .trim();

  const key =
    document
      .getElementById("disableKey")
      .value
      .trim();

  const result =
    document
      .getElementById("disableResult");

  if (!secret) {
    result.textContent =
      "Enter admin password.";
    return;
  }

  if (!key) {
    result.textContent =
      "Enter customer API key.";
    return;
  }

  result.textContent =
    "Disabling...";

  try {

    const response =
      await fetch(
        API + "/admin/disable-key",
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json",
            "X-Admin-Secret":
              secret
          },
          body: JSON.stringify({
            api_key: key
          })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data?.error?.message ||
        "Failed to disable key"
      );
    }

    result.textContent =
      "Customer key disabled.";

  } catch (error) {

    result.textContent =
      "Error: " + error.message;
  }
}


/* Chat */

async function sendMessage() {

  const input =
    document
      .getElementById("message");

  const keyInput =
    document
      .getElementById("apiKey");

  const sendButton =
    document
      .getElementById("sendButton");

  const text =
    input.value.trim();

  const key =
    keyInput.value.trim();

  if (!text) {
    return;
  }

  if (!key) {
    alert(
      "Please enter your customer API key."
    );
    return;
  }

  input.value = "";

  sendButton.disabled = true;

  const box =
    document
      .getElementById("chatbox");

  const user =
    document.createElement("div");

  user.className =
    "message user";

  user.textContent =
    text;

  box.appendChild(user);

  const thinking =
    document.createElement("div");

  thinking.className =
    "message assistant";

  thinking.textContent =
    "Thinking...";

  box.appendChild(thinking);

  box.scrollTop =
    box.scrollHeight;

  try {

    const response =
      await fetch(
        API + "/v1/chat/completions",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " + key
          },

          body: JSON.stringify({
            model: "qwen3.5-27b",

            messages: [
              {
                role: "user",
                content: text
              }
            ]
          })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data?.error?.message ||
        "API request failed"
      );
    }

    const answer =
      data?.choices?.[0]
        ?.message?.content;

    thinking.textContent =
      answer ||
      "No response.";

    if (data?.billing) {

      const billing =
        data.billing;

      thinking.textContent +=
        "\n\n" +
        "Cost: RM " +
        Number(
          billing.cost_rm || 0
        ).toFixed(6) +
        "\n" +
        "Remaining: RM " +
        Number(
          billing.remaining_balance_rm || 0
        ).toFixed(2);
    }

    box.scrollTop =
      box.scrollHeight;

  } catch (error) {

    thinking.textContent =
      "Error: " +
      error.message;

  } finally {

    sendButton.disabled = false;
  }
}


/* Enter to send */

document
  .getElementById("message")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();
      }
    }
  );

</script>

</body>
</html>
