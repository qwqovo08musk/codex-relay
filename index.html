<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex Relay</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .app {
      max-width: 900px;
      margin: auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: white;
    }

    header {
      padding: 18px 20px;
      border-bottom: 1px solid #ddd;
      font-size: 20px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 16px;
      padding: 12px 15px;
      border-radius: 12px;
      max-width: 85%;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .user {
      margin-left: auto;
      background: #e9e9e9;
    }

    .assistant {
      margin-right: auto;
      background: #f7f7f7;
      border: 1px solid #eee;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #ddd;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 50px;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 0 20px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    Codex Relay
  </header>

  <div id="chat">
    <div class="message assistant">
      Hello! Ask me anything.
    </div>
  </div>

  <div class="input-area">
    <textarea
      id="input"
      placeholder="Type your message..."
    ></textarea>

    <button id="send">
      Send
    </button>
  </div>

</div>

<script>
const API_URL = "https://codex-relay.onrender.com/v1/chat/completions";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");

const messages = [];

function addMessage(role, content) {
  const div = document.createElement("div");

  div.className = "message " + role;
  div.textContent = content;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  return div;
}

async function sendMessage() {
  const text = input.value.trim();

  if (!text || send.disabled) {
    return;
  }

  input.value = "";
  send.disabled = true;

  addMessage("user", text);

  messages.push({
    role: "user",
    content: text
  });

  const thinking = addMessage("assistant", "Thinking...");

  try {
    const response = await fetch(API_URL, {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        model: "qwen3.5-27b",
        messages: messages
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data?.error?.message || "API request failed"
      );
    }

    const answer =
      data?.choices?.[0]?.message?.content ||
      "No response received.";

    thinking.textContent = answer;

    messages.push({
      role: "assistant",
      content: answer
    });

  } catch (error) {

    thinking.textContent =
      "Error: " + error.message;

  } finally {
    send.disabled = false;
    input.focus();
  }
}

send.addEventListener("click", sendMessage);

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>
