<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codex Relay</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}

.app{
  max-width:1000px;
  margin:auto;
  min-height:100vh;
  background:#fff;
}

header{
  padding:20px;
  border-bottom:1px solid #ddd;
  font-size:22px;
  font-weight:bold;
}

nav{
  display:flex;
  border-bottom:1px solid #ddd;
}

nav button{
  flex:1;
  padding:15px;
  border:0;
  background:white;
  color:#111;
}

nav button.active{
  background:#111;
  color:white;
}

section{
  padding:20px;
}

.hidden{
  display:none;
}

.card{
  border:1px solid #ddd;
  border-radius:12px;
  padding:18px;
  margin-bottom:15px;
}

input,textarea{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  margin:7px 0 12px;
  font-size:15px;
}

button{
  padding:11px 16px;
  border:0;
  border-radius:8px;
  background:#111;
  color:white;
  cursor:pointer;
}

.chatbox{
  min-height:400px;
}

.message{
  padding:12px 15px;
  margin:10px 0;
  border-radius:10px;
  white-space:pre-wrap;
}

.user{
  background:#eee;
  margin-left:15%;
}

.assistant{
  background:#f7f7f7;
  margin-right:15%;
}

.row{
  display:flex;
  gap:10px;
}

.row textarea{
  flex:1;
}

.row button{
  width:100px;
}

.key{
  font-family:monospace;
  background:#f3f3f3;
  padding:10px;
  border-radius:8px;
  word-break:break-all;
}
</style>
</head>

<body>

<div class="app">

<header>Codex Relay</header>

<nav>
<button id="chatTab" class="active" onclick="showPage('chat')">
Chat
</button>

<button id="adminTab" onclick="showPage('admin')">
Admin
</button>
</nav>

<section id="chat">

<div class="card">

<label>API Key</label>

<input
id="apiKey"
placeholder="cr_..."
autocomplete="off"
>

</div>

<div id="chatbox" class="chatbox">

<div class="message assistant">
Hello! Ask me anything.
</div>

</div>

<div class="row">

<textarea
id="message"
placeholder="Type your message..."
></textarea>

<button onclick="sendMessage()">
Send
</button>

</div>

</section>


<section id="admin" class="hidden">

<div class="card">

<h2>Create API Key</h2>

<p>Create a new customer API key.</p>

<button onclick="createKey()">
Create Key
</button>

<div id="newKey"></div>

</div>

</section>

</div>


<script>

const API = "https://codex-relay.onrender.com";


function showPage(page){

document.getElementById("chat").classList.toggle(
"hidden",
page !== "chat"
);

document.getElementById("admin").classList.toggle(
"hidden",
page !== "admin"
);

document.getElementById("chatTab").classList.toggle(
"active",
page === "chat"
);

document.getElementById("adminTab").classList.toggle(
"active",
page === "admin"
);

}


async function createKey(){

const result = document.getElementById("newKey");

result.textContent = "Creating...";

try{

const response = await fetch(
API + "/admin/create-key",
{
method:"POST"
}
);

const data = await response.json();

if(!response.ok){

throw new Error(
data?.error?.message || "Failed to create key"
);

}

result.innerHTML =
"<p>New API Key:</p>" +
"<div class='key'>" +
data.api_key +
"</div>";

}catch(error){

result.textContent =
"Error: " + error.message;

}

}


async function sendMessage(){

const input =
document.getElementById("message");

const keyInput =
document.getElementById("apiKey");

const text =
input.value.trim();

const key =
keyInput.value.trim();

if(!text){

return;

}

if(!key){

alert("Please enter your API Key.");

return;

}

input.value = "";

const box =
document.getElementById("chatbox");


const user =
document.createElement("div");

user.className =
"message user";

user.textContent =
text;

box.appendChild(user);


const thinking =
document.createElement("div");

thinking.className =
"message assistant";

thinking.textContent =
"Thinking...";

box.appendChild(thinking);


try{

const response = await fetch(
API + "/v1/chat/completions",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"Authorization":"Bearer " + key
},

body:JSON.stringify({
model:"qwen3.5-27b",

messages:[
{
role:"user",
content:text
}
]
})
}
);


const data =
await response.json();


if(!response.ok){

throw new Error(
data?.error?.message ||
"API request failed"
);

}


const answer =
data?.choices?.[0]?.message?.content;


thinking.textContent =
answer || "No response.";


}catch(error){

console.error(error);

thinking.textContent =
"Error: " + error.message;

}

}

</script>

</body>
</html>
